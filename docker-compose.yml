name: industrial-data-collector

services:
  mongo: 
    image: mongo:8.3
    container_name: mongo-db
    restart: unless-stopped
    ports: ["27017:27017"]
    networks: ["backend"]
    volumes: ["mongo_data:/data/db"]
  
  postgres:
    image: postgres:18.4
    container_name: postgres-db
    restart: unless-stopped
    ports: ["5432:5432"]
    networks: ["backend"]
    volumes: ["postgres_data:/data/db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports: ["1883:1883"]
    networks: ["backend"]
    volumes: ["mosquitto_data:/mosquitto/data", "./mosquitto/config:/mosquitto/config"]


volumes:
  mongo_data:
  postgres_data:
  mosquitto_data:

networks:
  backend:
    driver: bridge